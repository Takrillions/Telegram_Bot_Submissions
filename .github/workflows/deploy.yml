name: Deploy Telegram Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: telegram-bot-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-6bd5d4f2-e1f7-4170-8cc
  ZONE: us-east1-d
  VM_NAME: telegram-bot-submissions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/54487318425/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@project-6bd5d4f2-e1f7-4170-8cc.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Prepare deployment archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.venv' \
            --exclude='*.sqlite3' \
            --exclude='*.db' \
            --exclude='gha-creds-*.json' \
            -czf /tmp/telegram-bot-deploy.tar.gz .

      - name: Upload release archive and deploy script to VM
        run: |
          gcloud compute scp \
            /tmp/telegram-bot-deploy.tar.gz \
            "${VM_NAME}:/tmp/telegram-bot-deploy.tar.gz" \
            --project="${PROJECT_ID}" \
            --zone="${ZONE}" \
            --tunnel-through-iap \
            --quiet

      - name: Upload deploy script to VM
        run: |
          gcloud compute scp scripts/deploy_release.sh "${VM_NAME}:/tmp/deploy_release.sh" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap --quiet

      - name: Deploy release and collect diagnostics
        run: |
          RELEASE_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::12}"
          gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap --quiet --command="sudo -H -u takrillions bash /tmp/deploy_release.sh /tmp/telegram-bot-deploy.tar.gz ${RELEASE_ID} ${GITHUB_SHA}" || {
            gcloud compute ssh "${VM_NAME}" --project="${PROJECT_ID}" --zone="${ZONE}" --tunnel-through-iap --quiet --command='sudo journalctl -u telegram-bot -n 100 --no-pager' || true
            exit 1
          }
